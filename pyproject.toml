[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codereview"
version = "0.4.0"
description = "Multi-agent GitHub PR reviewer with RAG-style context and structured findings"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "cipheraxat" }]
dependencies = [
  "anthropic>=0.40.0",
  "httpx>=0.27.0",
  "langgraph>=0.2.0",
  "openai>=1.50.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pygithub>=2.4.0",
  "pyyaml>=6.0.2",
  "rich>=13.8.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
codereview = "codereview.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/codereview"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = ["src/codereview", "README.md", "reviewer.example.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
