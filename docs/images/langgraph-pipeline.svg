<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="LangGraph orchestration pipeline">
  <rect width="720" height="360" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" fill="#111827" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">LangGraph Fan-Out / Fan-In</text>

  <rect x="300" y="60" width="120" height="44" rx="20" fill="#111827"/>
  <text x="360" y="87" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">START</text>

  <rect x="270" y="130" width="180" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="360" y="160" text-anchor="middle" fill="#92400e" font-size="13" font-weight="700">build_context</text>

  <rect x="120" y="220" width="170" height="50" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="205" y="250" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="700">security_review</text>

  <rect x="430" y="220" width="170" height="50" rx="8" fill="#fee2e2" stroke="#ef4444"/>
