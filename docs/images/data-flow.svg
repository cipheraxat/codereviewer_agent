<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-label="PR review data flow">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1100" height="300" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="550" y="32" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">End-to-End Data Flow</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="20" y="70" width="100" height="64" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="70" y="96" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="700">1. Trigger</text>
    <text x="70" y="114" text-anchor="middle" fill="#1e40af" font-size="10">PR opened/sync</text>
    <text x="70" y="126" text-anchor="middle" fill="#1e40af" font-size="10">or CLI command</text>

    <rect x="140" y="70" width="100" height="64" rx="8" fill="#cffafe" stroke="#06b6d4"/>
    <text x="190" y="96" text-anchor="middle" fill="#155e75" font-size="12" font-weight="700">2. Index</text>
    <text x="190" y="114" text-anchor="middle" fill="#0e7490" font-size="10">code + JIRA +</text>
    <text x="190" y="126" text-anchor="middle" fill="#0e7490" font-size="10">Confluence</text>

    <rect x="260" y="70" width="100" height="64" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="310" y="96" text-anchor="middle" fill="#312e81" font-size="12" font-weight="700">3. Ingest</text>
    <text x="310" y="114" text-anchor="middle" fill="#3730a3" font-size="10">fetch diff,</text>
    <text x="310" y="126" text-anchor="middle" fill="#3730a3" font-size="10">files, patches</text>

    <rect x="380" y="70" width="100" height="64" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="430" y="96" text-anchor="middle" fill="#92400e" font-size="12" font-weight="700">4. Retrieve</text>
    <text x="430" y="114" text-anchor="middle" fill="#b45309" font-size="10">vector search</text>
    <text x="430" y="126" text-anchor="middle" fill="#b45309" font-size="10">+ BM25 fallback</text>

    <rect x="500" y="70" width="100" height="64" rx="8" fill="#fee2e2" stroke="#ef4444"/>
    <text x="550" y="96" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="700">5. Analyze</text>
    <text x="550" y="114" text-anchor="middle" fill="#b91c1c" font-size="10">security + pattern</text>
    <text x="550" y="126" text-anchor="middle" fill="#b91c1c" font-size="10">agents (parallel)</text>

    <rect x="620" y="70" width="100" height="64" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="670" y="96" text-anchor="middle" fill="#5b21b6" font-size="12" font-weight="700">6. Ensemble</text>
    <text x="670" y="114" text-anchor="middle" fill="#6d28d9" font-size="10">filter, dedupe,</text>
    <text x="670" y="126" text-anchor="middle" fill="#6d28d9" font-size="10">confidence score</text>

    <rect x="740" y="70" width="100" height="64" rx="8" fill="#dcfce7" stroke="#22c55e"/>
    <text x="790" y="96" text-anchor="middle" fill="#166534" font-size="12" font-weight="700">7. Publish</text>
    <text x="790" y="114" text-anchor="middle" fill="#15803d" font-size="10">PR comments +</text>
    <text x="790" y="126" text-anchor="middle" fill="#15803d" font-size="10">JSON artifact</text>

    <line x1="120" y1="102" x2="138" y2="102" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>
    <line x1="240" y1="102" x2="258" y2="102" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>
    <line x1="360" y1="102" x2="378" y2="102" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>
    <line x1="480" y1="102" x2="498" y2="102" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>
    <line x1="600" y1="102" x2="618" y2="102" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>
    <line x1="720" y1="102" x2="738" y2="102" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>

    <rect x="80" y="180" width="940" height="88" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="100" y="206" fill="#0f172a" font-size="13" font-weight="700">Structured Finding (every issue)</text>
    <text x="100" y="228" fill="#334155" font-size="11">category - severity - title - file - line - rationale - suggestion - confidence - agent</text>
    <text x="100" y="252" fill="#64748b" font-size="11">Example: [high / security] Possible hardcoded secret - src/auth.py:42 - confidence 0.85</text>
  </g>
</svg>
