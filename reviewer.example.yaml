# Copy to reviewer.yaml in your repo root and customize for your team.

languages:
  - python
  - typescript
  - javascript
  - go

ignore_globs:
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/.venv311/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/*.lock"
  - "**/vendor/**"

severity_threshold: medium  # low | medium | high | critical

custom_rules:
  - id: no-raw-sql
    description: Do not use string-concatenated SQL; use parameterized queries or an ORM.
    pattern: "execute\\(.*\\+.*\\)|f\"SELECT|f'SELECT"
    severity: high
    category: security

  - id: http-timeout
    description: Outbound HTTP calls must set an explicit timeout.
    pattern: "requests\\.(get|post|put|delete|patch)\\([^)]*\\)"
    severity: medium
    category: quality

  # bare-except / privileged-container covered by built-in python + yaml rule packs

  - id: prometheus-counter-total
    description: Prometheus counter metrics should use the _total suffix for stable metrics compliance.
    pattern: "Name:\\s*\"[a-z0-9_]+_changes\""
    severity: medium
    category: quality

team_conventions: |
  - Prefer small, focused functions under 40 lines.
  - Add or update tests for behavior changes.
  - Document public APIs and non-obvious logic.
  - Never commit secrets, API keys, or credentials.

context:
  max_snippets: 12
  max_snippet_chars: 2000
  neighbor_depth: 1
  min_vector_snippets_before_fallback: 2

# JIRA / Confluence — indexed into Supabase when external_context.enabled: true
# Leave enabled: false if you do not want ticket/page RAG (and keep vector.enabled: false).
external_context:
  enabled: false
  max_snippets: 4
  max_chars_per_source: 3000
  jira:
    enabled: true
    base_url: yourcompany.atlassian.net
    projects: [CP, ENG]
    max_issues: 3
    max_index_issues: 100
    # Prefer recent tickets to bound embed cost:
    index_jql: "project in (CP, ENG) AND updated >= -30d ORDER BY updated DESC"
  confluence:
    enabled: true
    spaces: [ENG, PLATFORM]
    max_pages: 2
    max_index_pages: 50
    follow_jira_remote_links: true

# Unified RAG: batch-index JIRA + Confluence only; query vectors at review time.
# Repo code is never embedded (OCR select/bundle + tools + BM25 cover code).
# To disable Supabase entirely: keep vector.enabled: false (default) and omit secrets.
vector:
  enabled: false
  unified_rag: true
  embedding_model: openai/text-embedding-3-small
  indexing:
    sources: [jira, confluence]   # code is ignored even if listed
  supabase:
    enabled: true
    table: code_embeddings
    index_on_review: false        # ignored — code is never upserted on review
    match_threshold: 0.55
    vector_top_k: 12

posting:
  min_confidence: 0.70
  max_inline_comments: 25

ensemble:
  llm_verify: true
  fact_check: true

# OCR-inspired harness: select/bundle files, language packs, tools, effort
review:
  effort: medium          # low | medium | high
  use_tools: true         # enrich context via file_read / code_search
  precision_mode: true
  max_files_per_bundle: 8
  max_bundles: 4
  max_diff_chars_per_file: 40000
  # rule_packs: [python, typescript, javascript, yaml]  # defaults to `languages` + yaml

