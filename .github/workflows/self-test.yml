name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Smoke test local diff review
        run: |
          codereview review-diff tests/fixtures/sample_diff.patch --repo-root . --output /tmp/review-report.json
          test -f /tmp/review-report.json

      - name: Run benchmark eval
        run: |
          codereview eval --benchmark-dir benchmarks/golden --config reviewer.example.yaml --output benchmarks/results.json
          python - <<'PY'
          import json
          from pathlib import Path
          results = json.loads(Path("benchmarks/results.json").read_text())
          summary = results["summary"]
          assert summary["case_count"] >= 4, summary
          assert summary["recall"] >= 0.9, summary
          assert summary["precision"] >= 0.65, summary
          print("Benchmark gate passed:", summary)
          PY
