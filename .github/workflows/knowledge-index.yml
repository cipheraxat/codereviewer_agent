name: Knowledge Index

# Batch-index JIRA + Confluence into Supabase for review-time RAG.
# Repo code is NOT embedded — PR review uses select/bundle + tools + BM25 on the checkout.

on:
  schedule:
    # Daily 06:00 UTC — Atlassian content changes outside git
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated sources (jira,confluence). code is ignored."
        required: false
        default: "jira,confluence"

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install codereview
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Index JIRA and Confluence into Supabase
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'openrouter' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          ATLASSIAN_DOMAIN: ${{ secrets.ATLASSIAN_DOMAIN }}
        run: |
          if [[ ! -f reviewer.yaml ]]; then
            echo "::error::reviewer.yaml is required. Commit one with vector.enabled + external_context.enabled for Atlassian indexing."
            exit 1
          fi
          SOURCES="${{ github.event.inputs.sources }}"
          if [[ -z "$SOURCES" ]]; then
            SOURCES="jira,confluence"
          fi
          codereview index-knowledge \
            --repo "${{ github.repository }}" \
            --repo-root . \
            --config reviewer.yaml \
            --sources "$SOURCES"
